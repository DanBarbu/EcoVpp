{{- if .Values.priceForecast.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eco-vpp.fullname" . }}-price-forecast
  labels: {{- include "eco-vpp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.priceForecast.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eco-vpp.name" . }}
      component: price-forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eco-vpp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        component: price-forecast
    spec:
      containers:
        - name: price-forecast
          image: {{ include "eco-vpp.image" (dict "Values" .Values "component" "price-forecast") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8003
          env:
            - name: SITE_LAT
              value: {{ .Values.forecast.site.lat | quote }}
            - name: SITE_LON
              value: {{ .Values.forecast.site.lon | quote }}
            - name: PANEL_TILT
              value: {{ .Values.forecast.site.tilt | quote }}
            - name: PANEL_AZIMUTH
              value: {{ .Values.forecast.site.azimuth | quote }}
            - name: NOWCAST_STEP_MIN
              value: {{ .Values.priceForecast.nowcastStepMin | quote }}
            - name: METOC_NOWCAST
              value: {{ ternary "1" "0" .Values.priceForecast.metocEnabled | quote }}
            - name: PRICE_HORIZON_HOURS
              value: {{ .Values.priceForecast.horizonHours | quote }}
            - name: PV_CAPACITY_KW
              value: {{ .Values.priceForecast.pvCapacityKw | quote }}
            - name: WIND_CAPACITY_KW
              value: {{ .Values.priceForecast.windCapacityKw | quote }}
            - name: PRICE_SOURCE
              value: {{ .Values.priceForecast.priceSource | quote }}
            - name: ENTSOE_TOKEN
              value: {{ .Values.priceForecast.entsoeToken | quote }}
            - name: ZONE
              value: {{ .Values.priceForecast.zone | quote }}
            - name: RO_ZONE_EIC
              value: {{ .Values.priceForecast.roZoneEic | quote }}
            - name: CORRELATION_THRESHOLD
              value: {{ .Values.priceForecast.correlationThreshold | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8003 }
            initialDelaySeconds: 5
          resources: {{- toYaml .Values.priceForecast.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eco-vpp.fullname" . }}-price-forecast
  labels: {{- include "eco-vpp.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "eco-vpp.name" . }}
    component: price-forecast
  ports:
    - port: 8003
      targetPort: 8003
{{- end -}}
