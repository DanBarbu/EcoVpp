name: Price calibration (EU markets)

# Weekly correlation check of the price-forecast model against real EU
# day-ahead prices. Re-fits / re-anchors each bidding zone and commits the
# updated calibration.<zone>.json files back to the repo.
#
# Default source is Energy-Charts (Fraunhofer ISE) — TOKEN-FREE, no secret
# needed. Optionally set source=entsoe with the ENTSOE_TOKEN secret for the
# official ENTSO-E feed.

on:
  schedule:
    - cron: "30 5 * * 1"   # Mondays 05:30 UTC
  workflow_dispatch:
    inputs:
      zone:
        description: "Single zone code (blank = all EU zones)"
        required: false
        default: ""
      days:
        description: "Backtest window (days)"
        required: false
        default: "14"
      source:
        description: "Market data source"
        required: false
        default: "energycharts"
        type: choice
        options: [energycharts, entsoe]

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/price-forecast/requirements.txt
      - name: Install deps
        run: pip install -r services/price-forecast/requirements.txt

      - name: Run calibration
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          CALIBRATION_DIR: calibrations
        run: |
          cd services/price-forecast
          mkdir -p calibrations
          SOURCE="${{ github.event.inputs.source }}"; SOURCE="${SOURCE:-energycharts}"
          if [ "$SOURCE" = "entsoe" ] && [ -z "$ENTSOE_TOKEN" ]; then
            echo "::warning::source=entsoe but ENTSOE_TOKEN not set — falling back to energycharts."
            SOURCE="energycharts"
          fi
          ZONE_ARG="--all"
          if [ -n "${{ github.event.inputs.zone }}" ]; then ZONE_ARG="--zone ${{ github.event.inputs.zone }}"; fi
          DAYS="${{ github.event.inputs.days }}"; DAYS="${DAYS:-14}"
          PYTHONPATH=. python validate.py $ZONE_ARG --days "$DAYS" --source "$SOURCE" | tee calibrations/REPORT.txt

      - name: Commit updated calibrations
        run: |
          cd services/price-forecast
          if [ -n "$(git status --porcelain calibrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add calibrations
            git commit -m "chore(price-forecast): weekly EU market recalibration [skip ci]"
            git push
          else
            echo "No calibration changes."
          fi
