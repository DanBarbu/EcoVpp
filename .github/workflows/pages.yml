name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assemble Pages bundle
        run: |
          mkdir -p dist
          cp -r site/. dist/
          mkdir -p dist/analogreader
          cp -r analogreader-site/. dist/analogreader/
          # The repo serves two demos under one Pages site:
          #   /                 → EcoVpp marketing + demo
          #   /analogreader/    → analogreader.online demo (pre-deploy preview)
          # When analogreader gets its own repo + custom domain, drop the
          # /analogreader/ tree from here.

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
